name: mask_creator
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pyqt=5.15
  - pyqtgraph
  - h5py
  # Registers the LZ4 / bitshuffle / blosc HDF5 filters that the 12-ID
  # detector files are written with. Without it, reads fail with
  # "Can't synchronously read data (can't open directory)".
  - hdf5plugin
  - numpy
  - pillow
